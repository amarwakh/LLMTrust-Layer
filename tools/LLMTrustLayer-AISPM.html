<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel (JSX transpiler — runs once on load) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body {
      background: #050a0f;
      color: #c8d8e8;
      font-family: 'Rajdhani', sans-serif;
      overflow-x: hidden;
    }
    /* Scanline overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 9999;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px
      );
    }
    /* Grid background */
    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0,212,255,0.012) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.012) 1px, transparent 1px);
      background-size: 40px 40px;
    }
    /* Loading screen shown before React mounts */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #050a0f; z-index: 99998;
      font-family: 'Share Tech Mono', monospace;
      gap: 16px;
    }
    #loading .hex {
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #004d5e, #00d4ff 60%);
      clip-path: polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #050a0f; font-weight: bold;
      animation: hexPulse 1.5s ease-in-out infinite;
    }
    @keyframes hexPulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(0,212,255,0); }
      50%      { box-shadow: 0 0 0 12px rgba(0,212,255,0); }
    }
    #loading .title  { color: #00d4ff; font-size: 18px; letter-spacing: 4px; }
    #loading .sub    { color: #2a4060; font-size: 10px; letter-spacing: 2px; }
    #loading .bar    { width: 200px; height: 2px; background: #0d1620; border-radius: 1px; overflow: hidden; }
    #loading .fill   { height: 100%; background: linear-gradient(90deg, #00d4ff, #00ff88); animation: loadBar 1.4s ease-in-out infinite; }
    @keyframes loadBar { 0%{width:0%;margin-left:0} 50%{width:60%;margin-left:20%} 100%{width:0%;margin-left:100%} }
    #loading .status { color: #1a2d42; font-size: 9px; letter-spacing: 1px; }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1a2d42; border-radius: 2px; }

    /* Offline banner */
    #offline-banner {
      display: none; position: fixed; top: 0; left: 0; right: 0;
      background: rgba(255,68,85,.9); color: #fff;
      font-family: 'Share Tech Mono', monospace; font-size: 11px;
      text-align: center; padding: 8px; z-index: 99999;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <!-- Offline warning -->
  <div id="offline-banner">
    ⚠ NO INTERNET CONNECTION — CDN SCRIPTS AND API CALLS REQUIRE NETWORK ACCESS
  </div>

  <!-- Loading screen -->
  <div id="loading">
    <div class="hex">AI</div>
    <div class="title">AISPM</div>
    <div class="sub">AI SECURITY POSTURE MANAGEMENT</div>
    <div class="bar"><div class="fill"></div></div>
    <div class="status" id="load-status">LOADING REACT...</div>
  </div>

  <!-- App mounts here -->
  <div id="root"></div>

  <!-- Offline detection -->
  <script>
    window.addEventListener('offline', () => {
      document.getElementById('offline-banner').style.display = 'block';
    });
    window.addEventListener('online', () => {
      document.getElementById('offline-banner').style.display = 'none';
    });
    if (!navigator.onLine) {
      document.getElementById('offline-banner').style.display = 'block';
    }
  </script>

  .step-num { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-size:11px; border:1px solid; flex-shrink:0; }
  .step-num.done { background:var(--green-d); color:var(--green); border-color:var(--green); }
  .step-num.active { background:rgba(0,212,255,.1); color:var(--cyan); border-color:var(--cyan); box-shadow:0 0 10px rgba(0,212,255,.2); }

  .step-line { flex:1; height:1px; background:var(--bdr); margin:0 12px; min-width:30px; }

  .fade { animation:fadeIn .4s ease; }

  .mt16 { margin-top:16px; } .mb20 { margin-bottom:20px; } .gap12 { gap:12px; }
  .flex-end { display:flex; justify-content:flex-end; gap:10px; }

`;

function Spark({ data, color }) {
  const mx = Math.max(...data, 1);
  return (
    <div className="spark">
      {data.map((v,i) => (
        <div key={i} className="sb" style={{ height:`${(v/mx)*100}%`, background:`${color}${Math.round(50+(i/data.length)*200).toString(16).padStart(2,"0")}` }}/>
      ))}
    </div>
  );
}

// ── SCORE RING ────────────────────────────────────────────────────
function Ring({ score, color, label }) {
  const r=50, c=2*Math.PI*r, d=c*(Math.min(score,100)/100);
  return (
    <div className="ring-wrap">
      <div className="ring">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r={r} fill="none" stroke="var(--bg)" strokeWidth="9"/>
          <circle cx="60" cy="60" r={r} fill="none" stroke={color} strokeWidth="9"
            strokeDasharray={`${d} ${c}`} strokeLinecap="round"
            style={{transition:"stroke-dasharray 1.2s cubic-bezier(.4,0,.2,1)",filter:`drop-shadow(0 0 5px ${color})`}}/>
        </svg>
        <div className="ring-lbl">
          <div className="ring-num" style={{color}}>{score}</div>
          <div className="ring-sub">/ 100</div>
        </div>
      </div>
      <div className="ring-title">{label}</div>
    </div>
  );
}

// ── MAIN ──────────────────────────────────────────────────────────
function AISPM() {
  const [tab, setTab] = useState("connect");
  const [step, setStep] = useState(1); // 1=connect, 2=discover, 3=review, 4=assess

  // Connection state
  const [provider, setProvider] = useState(null);
  const [apiKey, setApiKey] = useState("");
  const [showKey, setShowKey] = useState(false);
  const [connecting, setConnecting] = useState(false);
  const [connStatus, setConnStatus] = useState({}); // { anthropic: "ok"|"err", ... }
  const [connLogs, setConnLogs] = useState([]);

  // Discovery state
  const [discovering, setDiscovering] = useState(false);
  const [discovered, setDiscovered] = useState(null); // { models, capabilities, inventory }
  const [selectedSystems, setSelectedSystems] = useState([]);

  // Assessment state
  const [form, setForm] = useState({});
  const [assessing, setAssessing] = useState(false);
  const [result, setResult] = useState(null);
  const [assessLogs, setAssessLogs] = useState([]);
  const [error, setError] = useState(null);

  const [clock, setClock] = useState("");
  const logRef = useRef(null);
  const alogRef = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setClock(new Date().toISOString().replace("T"," ").slice(0,19)), 1000);
    setClock(new Date().toISOString().replace("T"," ").slice(0,19));
    return () => clearInterval(t);
  }, []);

  useEffect(() => { if(logRef.current) logRef.current.scrollTop = logRef.current.scrollHeight; }, [connLogs]);
  useEffect(() => { if(alogRef.current) alogRef.current.scrollTop = alogRef.current.scrollHeight; }, [assessLogs]);

  const addLog = (setter, msg, type="info") => {
    const ts = new Date().toISOString().slice(11,19);
    setter(l => [...l, {ts, msg, type}]);
  };
  const lc = (t) => ({info:"tc",success:"tg",warn:"ta",error:"tr",dim:"td",sec:"ts",purple:"tp"}[t]||"ts");

  // ── CONNECT + DISCOVER ──────────────────────────────────────────
  const doConnect = async () => {
    if (!provider || !apiKey) return;
    setConnecting(true); setConnLogs([]); setDiscovered(null); setError(null);
    const p = PROVIDERS.find(x => x.id === provider);

    addLog(setConnLogs, `Connecting to ${p.name} API...`, "info");
    addLog(setConnLogs, `Endpoint: ${p.apiBase}`, "dim");
    await new Promise(r => setTimeout(r, 500));

    try {
      let models = [];
      let testOk = false;

      // ── ANTHROPIC ──
      if (provider === "anthropic") {
        addLog(setConnLogs, "Validating API key format...", "dim");
        if (!apiKey.startsWith("sk-ant-")) throw new Error("Key should start with sk-ant-");
        addLog(setConnLogs, "Key format valid. Listing available models...", "info");

        const mRes = await fetch(`${p.apiBase}/models`, {
          headers: { "x-api-key": apiKey, "anthropic-version": "2023-06-01" }
        });
        if (!mRes.ok) throw new Error(`Models API returned ${mRes.status} — check key`);
        const mData = await mRes.json();
        models = (mData.data || []).map(m => ({
          id: m.id, name: m.display_name || m.id,
          contextWindow: m.context_window || null,
          provider: "anthropic"
        }));
        addLog(setConnLogs, `Found ${models.length} models`, "success");
        testOk = true;
      }

      // ── GEMINI ──
      else if (provider === "gemini") {
        addLog(setConnLogs, "Validating API key format...", "dim");
        if (!apiKey.startsWith("AIza")) throw new Error("Gemini key should start with AIza");
        addLog(setConnLogs, "Key format valid. Listing available models...", "info");

        const mRes = await fetch(`${p.apiBase}/models?key=${apiKey}`);
        if (!mRes.ok) throw new Error(`Models API returned ${mRes.status} — check key`);
        const mData = await mRes.json();
        models = (mData.models || [])
          .filter(m => m.supportedGenerationMethods?.includes("generateContent"))
          .map(m => ({
            id: m.name, name: m.displayName || m.name,
            contextWindow: m.inputTokenLimit || null,
            provider: "gemini"
          }));
        addLog(setConnLogs, `Found ${models.length} generative models`, "success");
        testOk = true;
      }

      // ── OPENAI ──
      else if (provider === "openai") {
        addLog(setConnLogs, "Validating API key format...", "dim");
        addLog(setConnLogs, "Listing available models...", "info");

        const mRes = await fetch(`${p.apiBase}/models`, {
          headers: { "Authorization": `Bearer ${apiKey}` }
        });
        if (!mRes.ok) throw new Error(`Models API returned ${mRes.status} — check key`);
        const mData = await mRes.json();
        models = (mData.data || [])
          .filter(m => m.id.startsWith("gpt-") || m.id.startsWith("o1") || m.id.startsWith("o3"))
          .slice(0, 20)
          .map(m => ({ id: m.id, name: m.id, contextWindow: null, provider: "openai" }));
        addLog(setConnLogs, `Found ${models.length} GPT/reasoning models`, "success");
        testOk = true;
      }

      if (!testOk || models.length === 0) throw new Error("No models returned — verify key permissions");

      addLog(setConnLogs, "Running AI-powered system inventory analysis...", "purple");
      await new Promise(r => setTimeout(r, 600));

      // ── USE ANTHROPIC API (always) to generate inventory from discovered models ──
      const inventoryPrompt = `You are an AI security engineer. Given this list of AI models available via a ${p.name} API key, generate a realistic system inventory showing what kinds of AI-powered systems an organisation likely has deployed.

Available models: ${models.map(m=>m.id).join(", ")}
Provider: ${p.name}

Return ONLY valid JSON — no markdown, no explanation:
{
  "systems": [
    {
      "id": "SYS-001",
      "name": "<realistic system name>",
      "model": "<one of the models above>",
      "systemType": "<A|B|C|D|E>",
      "typeName": "<LLM-as-Feature|LLM-as-Platform|Agentic|RAG|Fine-Tuned>",
      "description": "<2 sentence description of what this system likely does>",
      "dataSensitivity": "<Public|Internal|Confidential|Regulated>",
      "toolAccess": "<None|Read-only APIs|Web browsing|Database read/write|Code execution|Broad>",
      "authControls": "<None|API key only|User authentication|RBAC|SSO+MFA>",
      "estimatedRiskLevel": "<CRITICAL|HIGH|MEDIUM|LOW>",
      "riskRationale": "<one sentence why>",
      "tags": ["<tag1>", "<tag2>", "<tag3>"]
    }
  ],
  "summary": {
    "totalSystems": <number>,
    "highRiskCount": <number>,
    "primaryUseCase": "<string>",
    "topRisk": "<biggest security concern across this deployment>"
  }
}

Generate 3-5 realistic systems. Use the actual model IDs discovered. Make the systems realistic for an enterprise using ${p.name}.`;

      // Always call Anthropic for the AI analysis
      const aiRes = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 1000,
          messages: [{ role:"user", content: inventoryPrompt }]
        })
      });

      const aiData = await aiRes.json();
      const raw = aiData.content?.find(b=>b.type==="text")?.text || "{}";
      const inventory = JSON.parse(raw.replace(/```json|```/g,"").trim());

      addLog(setConnLogs, `Inventory analysis complete — ${inventory.systems?.length || 0} systems identified`, "success");
      addLog(setConnLogs, `Top risk: ${inventory.summary?.topRisk || "unknown"}`, "warn");
      addLog(setConnLogs, "Ready for security assessment.", "success");

      setDiscovered({ models, inventory, provider: p });
      setConnStatus(s => ({...s, [provider]: "ok"}));
      setStep(2);
      setTab("discover");

    } catch(e) {
      addLog(setConnLogs, `Connection failed: ${e.message}`, "error");
      setConnStatus(s => ({...s, [provider]: "err"}));
      setError(e.message);
    } finally {
      setConnecting(false);
    }
  };

  const toggleSystem = (id) => {
    setSelectedSystems(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  };

  const proceedToAssess = () => {
    const sys = discovered?.inventory?.systems?.filter(s => selectedSystems.includes(s.id)) || [];
    if (sys.length === 0) return;
    // Auto-populate form from first selected system
    const first = sys[0];
    setForm({
      name: first.name,
      systemType: first.systemType,
      description: first.description,
      dataSensitivity: first.dataSensitivity,
      toolAccess: first.toolAccess,
      deployment: "Cloud (SaaS)",
      authControls: first.authControls,
      compliance: "None",
      monitoring: "None",
      selectedSystems: sys,
    });
    setStep(3);
    setTab("assess");
  };

  // ── ASSESSMENT ─────────────────────────────────────────────────
  const buildPrompt = (f) => `You are a senior AI security engineer. Assess this AI system and return ONLY valid JSON.

System: ${f.name} [Type ${f.systemType}]
Description: ${f.description}
Data sensitivity: ${f.dataSensitivity}
Tool access: ${f.toolAccess}
Deployment: ${f.deployment}
Auth controls: ${f.authControls}
Compliance: ${f.compliance}
Monitoring: ${f.monitoring}
${f.selectedSystems?.length > 1 ? `Also in deployment: ${f.selectedSystems.slice(1).map(s=>s.name).join(", ")}` : ""}

Return:
{
  "posture_score": <0-100>,
  "risk_level": "<CRITICAL|HIGH|MEDIUM|LOW>",
  "executive_summary": "<2-3 sentences>",
  "threat_scores": {"PI":<1-16>,"TDP":<1-16>,"MWE":<1-16>,"IA":<1-16>,"SC":<1-16>,"DE":<1-16>,"AW":<1-16>},
  "findings": [{"id":"F-001","severity":"<CRITICAL|HIGH|MEDIUM|LOW>","threat_category":"<PI|TDP|MWE|IA|SC|DE|AW>","title":"<title>","description":"<2-3 sentences>","remediation":"<specific action>"}],
  "controls_present": ["<control>"],
  "controls_missing": ["<control>"],
  "compliance_gaps": ["<gap>"],
  "quick_wins": ["<action this week>"],
  "observability_recommendations": ["<monitoring recommendation>"]
}
Generate 4-8 findings. Be specific and technical.`;

  const runAssessment = async () => {
    if (!form.name) return;
    setAssessing(true); setError(null); setResult(null); setAssessLogs([]);
    setStep(4); setTab("results");

    addLog(setAssessLogs, `Target: ${form.name} [Type ${form.systemType}]`, "info");
    addLog(setAssessLogs, "Loading LLMTrust Layer threat taxonomy...", "dim");
    await new Promise(r => setTimeout(r, 500));
    addLog(setAssessLogs, "Running 7-category threat analysis...", "info");
    await new Promise(r => setTimeout(r, 400));
    addLog(setAssessLogs, "Calling Anthropic analysis engine...", "purple");

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:1000, messages:[{role:"user",content:buildPrompt(form)}] })
      });
      const data = await res.json();
      const raw = data.content?.find(b=>b.type==="text")?.text || "";
      const parsed = JSON.parse(raw.replace(/```json|```/g,"").trim());
      setResult(parsed);
      addLog(setAssessLogs, `Posture score: ${parsed.posture_score}/100`, parsed.posture_score >= 70 ? "success" : "warn");
      addLog(setAssessLogs, `Risk level: ${parsed.risk_level}`, parsed.risk_level==="CRITICAL"||parsed.risk_level==="HIGH" ? "error" : "warn");
      addLog(setAssessLogs, `${parsed.findings?.length} findings. Assessment complete.`, "success");
    } catch(e) {
      addLog(setAssessLogs, `Assessment failed: ${e.message}`, "error");
      setError(e.message);
    } finally {
      setAssessing(false);
    }
  };

  const ff = (k,v) => setForm(f => ({...f, [k]:v}));

  // ── OBS DATA ──────────────────────────────────────────────────
  const [obs] = useState(() => ({
    req:   Array.from({length:24},()=>Math.floor(Math.random()*80+20)),
    anom:  Array.from({length:24},()=>Math.floor(Math.random()*8)),
    lat:   Array.from({length:24},()=>Math.floor(Math.random()*400+100)),
    inj:   Array.from({length:24},()=>Math.floor(Math.random()*5)),
  }));

  const prov = PROVIDERS.find(x=>x.id===provider);

  // ── STEP INDICATOR ────────────────────────────────────────────
  const Steps = () => (
    <div className="steps">
      {[
        {n:1, label:"CONNECT"},
        {n:2, label:"DISCOVER"},
        {n:3, label:"REVIEW"},
        {n:4, label:"ASSESS"},
      ].map((s,i,arr) => (
        <div key={s.n} style={{display:"flex",alignItems:"center",flex: i<arr.length-1?1:"auto"}}>
          <div className="step">
            <div className={`step-num ${step>s.n?"done":step===s.n?"active":"idle"}`}>
              {step>s.n ? "✓" : s.n}
            </div>
            <div className={`step-label ${step>s.n?"done":step===s.n?"active":"idle"}`}>{s.label}</div>
          </div>
          {i<arr.length-1 && <div className={`step-line ${step>s.n?"done":""}`} style={{flex:1,margin:"0 12px"}}/>}
        </div>
      ))}
    </div>
  );

  // ── CONNECT TAB ───────────────────────────────────────────────
  const ConnectTab = () => (
    <div className="fade">
      <Steps/>
      <div className="info-box">
        <strong style={{color:"var(--cyan)",fontFamily:"var(--mono)",fontSize:10,letterSpacing:2}}>AUTO-DISCOVERY</strong><br/>
        Connect your AI provider API key. AISPM will query the provider's model catalogue, identify what models you have access to, and use AI analysis to generate a realistic system inventory — automatically populating the security assessment intake.
      </div>

      <div className="mb20">
        <div className="ctitle">Select Provider</div>
        <div className="provider-grid">
          {PROVIDERS.map(p => (
            <div key={p.id}
              className={`pcard ${provider===p.id?"selected":""} ${connStatus[p.id]==="ok"?"connected":""} ${connStatus[p.id]==="err"?"error-state":""}`}
              onClick={() => { setProvider(p.id); setApiKey(""); setError(null); }}>
              <div className="pcard-glow" style={{background:p.color}}/>
              <div className="pcard-icon">{p.icon}</div>
              <div className="pcard-name">{p.name}</div>
              <div className="pcard-desc">{p.desc}</div>
              <div className="pcard-status">
                {connStatus[p.id]==="ok" && <span className="pill pill-ok">● CONNECTED</span>}
                {connStatus[p.id]==="err" && <span className="pill pill-err">● ERROR</span>}
                {!connStatus[p.id] && <span className="pill pill-info">○ NOT CONNECTED</span>}
              </div>
            </div>
          ))}
        </div>
      </div>

      {provider && (
        <div className="fade">
          <div className="g2">
            <div className="card">
              <div className="ctitle">API Key — {prov?.name}</div>
              <div className="warn-box">
                🔒 Your API key is used only for this session — to query the model catalogue and run the security analysis. It is never stored or transmitted beyond the API calls shown in the discovery log.
              </div>
              <div className="ff mb20">
                <label>API Key</label>
                <div style={{position:"relative"}}>
                  <input
                    type={showKey?"text":"password"}
                    value={apiKey}
                    onChange={e=>setApiKey(e.target.value)}
                    placeholder={prov?.keyHint}
                    style={{paddingRight:80}}
                  />
                  <button className="btn btn-g btn-sm"
                    onClick={()=>setShowKey(s=>!s)}
                    style={{position:"absolute",right:6,top:"50%",transform:"translateY(-50%)",padding:"4px 10px",fontSize:9}}>
                    {showKey?"HIDE":"SHOW"}
                  </button>
                </div>
              </div>
              {error && (
                <div style={{background:"rgba(255,68,85,.08)",border:"1px solid var(--red-d)",borderRadius:2,padding:"10px 14px",marginBottom:14,fontFamily:"var(--mono)",fontSize:11,color:"var(--red)"}}>
                  ⚠ {error}
                </div>
              )}
              <button className="btn btn-p w100" onClick={doConnect} disabled={connecting||!apiKey}>
                {connecting ? "CONNECTING & DISCOVERING..." : `CONNECT + AUTO-DISCOVER INVENTORY →`}
              </button>
            </div>

            <div className="card">
              <div className="ctitle">Discovery Log</div>
              {connecting && <div className="load-bar"><div className="load-fill"/></div>}
              <div className="term" ref={logRef} style={{maxHeight:220}}>
                {connLogs.length === 0
                  ? <span className="td">Awaiting connection...</span>
                  : connLogs.map((l,i) => (
                    <div key={i}><span className="td">[{l.ts}] </span><span className={lc(l.type)}>{l.msg}</span></div>
                  ))
                }
                {connecting && <div><span className="tc">█</span></div>}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  // ── DISCOVER TAB ──────────────────────────────────────────────
  const DiscoverTab = () => {
    if (!discovered) return (
      <div style={{textAlign:"center",padding:"60px 20px",fontFamily:"var(--mono)",color:"var(--t3)"}}>
        <div style={{fontSize:32,marginBottom:16,opacity:.4}}>⬡</div>
        <div style={{fontSize:11,letterSpacing:3,color:"var(--t2)"}}>CONNECT AN API KEY FIRST</div>
      </div>
    );
    const { models, inventory, provider: p } = discovered;
    const allIds = inventory.systems?.map(s=>s.id) || [];
    const allSelected = allIds.every(id => selectedSystems.includes(id));

    return (
      <div className="fade">
        <Steps/>
        <div className="g4 mb20">
          <div className="card" style={{textAlign:"center",padding:"18px 14px"}}>
            <div style={{fontFamily:"var(--mono)",fontSize:28,color:"var(--cyan)",marginBottom:4}}>{models.length}</div>
            <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t2)",letterSpacing:2}}>MODELS DISCOVERED</div>
          </div>
          <div className="card" style={{textAlign:"center",padding:"18px 14px"}}>
            <div style={{fontFamily:"var(--mono)",fontSize:28,color:"var(--amber)",marginBottom:4}}>{inventory.summary?.totalSystems||0}</div>
            <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t2)",letterSpacing:2}}>SYSTEMS IDENTIFIED</div>
          </div>
          <div className="card" style={{textAlign:"center",padding:"18px 14px"}}>
            <div style={{fontFamily:"var(--mono)",fontSize:28,color:"var(--red)",marginBottom:4}}>{inventory.summary?.highRiskCount||0}</div>
            <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t2)",letterSpacing:2}}>HIGH RISK SYSTEMS</div>
          </div>
          <div className="card" style={{textAlign:"center",padding:"18px 14px"}}>
            <div style={{fontFamily:"var(--mono)",fontSize:14,color:"var(--green)",marginBottom:4,lineHeight:1.3}}>{p.name}</div>
            <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t2)",letterSpacing:2}}>CONNECTED PROVIDER</div>
          </div>
        </div>

        {inventory.summary?.topRisk && (
          <div className="warn-box mb20">
            <strong style={{color:"var(--amber)",fontFamily:"var(--mono)",fontSize:9,letterSpacing:2}}>TOP RISK IDENTIFIED</strong><br/>
            {inventory.summary.topRisk}
          </div>
        )}

        <div className="g2">
          <div>
            <div className="ctitle" style={{marginBottom:12}}>
              Discovered Systems
              <span style={{marginLeft:"auto",display:"flex",gap:8}}>
                <button className="btn btn-g btn-sm" onClick={()=>setSelectedSystems(allSelected?[]:[...allIds])}>
                  {allSelected?"DESELECT ALL":"SELECT ALL"}
                </button>
              </span>
            </div>
            {inventory.systems?.map(sys => (
              <div key={sys.id} className="disc-item" style={selectedSystems.includes(sys.id)?{borderColor:"var(--cyan)",background:"rgba(0,212,255,.03)"}:{}}>
                <div className="disc-check" onClick={()=>toggleSystem(sys.id)}>
                  <div style={{width:16,height:16,border:`1px solid ${selectedSystems.includes(sys.id)?"var(--cyan)":"var(--t3)"}`,borderRadius:2,background:selectedSystems.includes(sys.id)?"rgba(0,212,255,.15)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"var(--cyan)"}}>
                    {selectedSystems.includes(sys.id) && "✓"}
                  </div>
                </div>
                <div className="disc-body">
                  <div className="flex-c" style={{marginBottom:4}}>
                    <div className="disc-name">{sys.name}</div>
                    <span className={`sev ${sevClass(sys.estimatedRiskLevel)}`}>{sys.estimatedRiskLevel}</span>

                  <div className="disc-tags">
                    {sys.tags?.map(t=><span key={t} className="disc-tag hi">{t}</span>)}
                  </div>
                  <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--amber)",marginTop:6}}>⚠ {sys.riskRationale}</div>
                </div>
              </div>
            ))}
          </div>

          <div>
            <div className="ctitle">Available Models</div>
            <div style={{maxHeight:300,overflowY:"auto",paddingRight:4}}>
              {models.map(m => (
                <div key={m.id} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",border:"1px solid var(--bdr)",borderRadius:2,marginBottom:6,background:"var(--bg)",fontFamily:"var(--mono)",fontSize:10}}>
                  <div style={{width:6,height:6,borderRadius:"50%",background:p.color,flexShrink:0,boxShadow:`0 0 4px ${p.color}`}}/>
                  <div style={{flex:1,color:"var(--t2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{m.name || m.id}</div>
                  {m.contextWindow && <div style={{color:"var(--t3)",fontSize:9}}>{(m.contextWindow/1000).toFixed(0)}K ctx</div>}
                </div>
              ))}
            </div>

            <div className="card mt16">
              <div className="ctitle">Selected for Assessment</div>
              {selectedSystems.length === 0
                ? <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--t3)"}}>No systems selected</div>
                : <>
                  <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--green)",marginBottom:12}}>{selectedSystems.length} system{selectedSystems.length>1?"s":""} selected</div>
                  <button className="btn btn-p w100" onClick={proceedToAssess} disabled={selectedSystems.length===0}>
                    PROCEED TO SECURITY REVIEW →
                  </button>
                </>
              }
            </div>
          </div>
        </div>
      </div>
    );
  };

  // ── ASSESS TAB ────────────────────────────────────────────────
  const AssessTab = () => (
    <div className="fade">
      <Steps/>
      {step < 3 && (
        <div className="info-box">Connect an API key and select systems in the Discover tab to auto-populate this form.</div>
      )}
      <div className="g2">
        <div className="card">
          <div className="ctitle">System Profile {step>=3&&<span className="pill pill-ok" style={{marginLeft:6}}>AUTO-POPULATED</span>}</div>
          <div className="fg">
            <div className="ff full"><label>System Name *</label>
              <input value={form.name||""} onChange={e=>ff("name",e.target.value)} placeholder="System name"/>
            </div>
            <div className="ff full"><label>System Type</label>
              <select value={form.systemType||"A"} onChange={e=>ff("systemType",e.target.value)}>
                {[["A","Type A — LLM-as-Feature"],["B","Type B — LLM-as-Platform"],["C","Type C — Agentic"],["D","Type D — RAG"],["E","Type E — Fine-Tuned"]].map(([v,l])=><option key={v} value={v}>{l}</option>)}
              </select>
            </div>
            <div className="ff full"><label>Description</label>
              <textarea value={form.description||""} onChange={e=>ff("description",e.target.value)} placeholder="What does this system do?"/>
            </div>
            <div className="ff"><label>Data Sensitivity</label>
              <select value={form.dataSensitivity||"Internal"} onChange={e=>ff("dataSensitivity",e.target.value)}>
                {["Public","Internal","Confidential","Regulated (PII/PHI/PCI)"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
            <div className="ff"><label>Tool Access</label>
              <select value={form.toolAccess||"None"} onChange={e=>ff("toolAccess",e.target.value)}>
                {["None","Read-only APIs","Web browsing","Database read/write","Code execution","Broad"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
            <div className="ff"><label>Deployment</label>
              <select value={form.deployment||"Cloud (SaaS)"} onChange={e=>ff("deployment",e.target.value)}>
                {["Cloud (SaaS)","Cloud (IaaS)","GovCloud / FedRAMP","On-premises","Hybrid"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
            <div className="ff"><label>Auth Controls</label>
              <select value={form.authControls||"None"} onChange={e=>ff("authControls",e.target.value)}>
                {["None","API key only","User authentication","RBAC","SSO+MFA","Zero Trust"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
            <div className="ff"><label>Compliance</label>
              <select value={form.compliance||"None"} onChange={e=>ff("compliance",e.target.value)}>
                {["None","FedRAMP High","FedRAMP Moderate","HIPAA","PCI-DSS","SOC 2","ISO 27001","GDPR"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
            <div className="ff full"><label>Current Monitoring</label>
              <select value={form.monitoring||"None"} onChange={e=>ff("monitoring",e.target.value)}>
                {["None","Basic logging","Input/output logging","Anomaly detection","Full observability"].map(v=><option key={v}>{v}</option>)}
              </select>
            </div>
          </div>
          <button className="btn btn-p w100" onClick={runAssessment} disabled={assessing||!form.name}>
            {assessing ? "RUNNING ASSESSMENT..." : "RUN SECURITY POSTURE ASSESSMENT →"}
          </button>
        </div>

        <div style={{display:"flex",flexDirection:"column",gap:14}}>
          {form.selectedSystems?.length > 1 && (
            <div className="card">
              <div className="ctitle">Systems in Scope</div>
              {form.selectedSystems.map(s => (
                <div key={s.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8,fontFamily:"var(--mono)",fontSize:10}}>
                  <span className={`sev ${sevClass(s.estimatedRiskLevel)}`}>{s.estimatedRiskLevel}</span>
                  <span style={{color:"var(--t2)"}}>{s.name}</span>
                  <span style={{color:"var(--t3)",marginLeft:"auto"}}>Type {s.systemType}</span>
                </div>
              ))}
            </div>
          )}
          <div className="card">
            <div className="ctitle">Assessment Coverage</div>
            {THREATS.map(t => (
              <div key={t.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <div style={{width:24,height:24,background:`${t.color}22`,border:`1px solid ${t.color}44`,borderRadius:2,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                  <span style={{fontFamily:"var(--mono)",fontSize:7,color:t.color}}>{t.id}</span>
                </div>
                <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--t2)",flex:1}}>{t.label}</span>
                <div style={{width:5,height:5,borderRadius:"50%",background:t.color,boxShadow:`0 0 3px ${t.color}`}}/>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );

  // ── RESULTS TAB ───────────────────────────────────────────────
  const ResultsTab = () => {
    if (assessing) return (
      <div className="card fade">
        <div className="ctitle">Running Assessment</div>
        <div className="load-bar"><div className="load-fill"/></div>
        <div className="term" ref={alogRef} style={{maxHeight:280}}>
          {assessLogs.map((l,i)=>(
            <div key={i}><span className="td">[{l.ts}] </span><span className={lc(l.type)}>{l.msg}</span></div>
          ))}
          <div><span className="tc">█</span></div>
        </div>
      </div>
    );
    if (!result) return (
      <div style={{textAlign:"center",padding:"60px 20px",fontFamily:"var(--mono)",color:"var(--t3)"}}>
        <div style={{fontSize:32,marginBottom:16,opacity:.4}}>⬡</div>
        <div style={{fontSize:11,letterSpacing:3,color:"var(--t2)"}}>NO ASSESSMENT DATA</div>
        <div style={{fontSize:10,marginTop:8}}>Complete the intake and run an assessment first.</div>
      </div>
    );
    const critCount = result.findings?.filter(f=>f.severity==="CRITICAL").length||0;
    const highCount = result.findings?.filter(f=>f.severity==="HIGH").length||0;
    const sc = result.posture_score>=70?"var(--green)":result.posture_score>=40?"var(--amber)":"var(--red)";

    return (
      <div className="fade">
        <div className="g2 mb20">
          <div className="card" style={{display:"flex",flexDirection:"column",justifyContent:"space-between"}}>
            <div>
              <div className="ctitle">Executive Summary</div>
              <p style={{fontSize:13,lineHeight:1.7,marginBottom:14}}>{result.executive_summary}</p>
            </div>
            <div style={{display:"flex",gap:20,flexWrap:"wrap"}}>
              {[
                {l:"Risk Level",v:result.risk_level,c:result.risk_level==="CRITICAL"||result.risk_level==="HIGH"?"var(--red)":"var(--amber)"},
                {l:"Findings",v:result.findings?.length,c:"var(--t1)"},
                {l:"Critical",v:critCount,c:critCount>0?"var(--red)":"var(--green)"},
                {l:"High",v:highCount,c:highCount>0?"var(--amber)":"var(--green)"},
              ].map(s=>(
                <div key={s.l} style={{textAlign:"center"}}>
                  <div style={{fontFamily:"var(--mono)",fontSize:24,fontWeight:"bold",color:s.c}}>{s.v}</div>
                  <div style={{fontFamily:"var(--mono)",fontSize:8,color:"var(--t2)",letterSpacing:1}}>{s.l}</div>
                </div>
              ))}
            </div>
          </div>
          <div className="card">
            <Ring score={result.posture_score} color={sc} label="POSTURE SCORE"/>
          </div>
        </div>

        <div className="card mb20">
          <div className="ctitle">Threat Risk Scores</div>
          {THREATS.map(t=>{
            const s=result.threat_scores?.[t.id]||0;
            return (
              <div key={t.id} className="rrow">
                <div className="rlbl">{t.label}</div>
                <div className="rtrack"><div className="rfill" style={{width:`${(s/16)*100}%`,background:t.color}}/></div>
                <div className="rnum" style={{color:ratingColor(s)}}>{s}</div>
                <div className={`rbadge ${sevClass(ratingLabel(s))}`}>{ratingLabel(s)}</div>
              </div>
            );
          })}
        </div>

        <div className="card mb20">
          <div className="ctitle">Security Findings</div>
          <table className="ftbl">
            <thead><tr><th>ID</th><th>SEV</th><th>CAT</th><th>FINDING</th><th>REMEDIATION</th></tr></thead>
            <tbody>
              {result.findings?.map(f=>(
                <tr key={f.id}>
                  <td style={{color:"var(--t3)"}}>{f.id}</td>
                  <td><span className={`sev ${sevClass(f.severity)}`}>{f.severity}</span></td>
                  <td><span style={{color:"var(--cyan)",fontSize:9}}>{f.threat_category}</span></td>
                  <td><div style={{fontWeight:"bold",marginBottom:3}}>{f.title}</div><div style={{color:"var(--t2)",lineHeight:1.5}}>{f.description}</div></td>
                  <td style={{color:"var(--green)",lineHeight:1.5,fontSize:9}}>{f.remediation}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="g2 mb20">
          <div className="card">
            <div className="ctitle">Controls</div>
            {result.controls_present?.length>0&&<>
              <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t3)",letterSpacing:2,marginBottom:6}}>PRESENT</div>
              {result.controls_present.map(c=>(
                <div key={c} style={{display:"flex",gap:7,marginBottom:5,fontSize:11,fontFamily:"var(--mono)"}}>
                  <span style={{color:"var(--green)"}}>✓</span><span style={{color:"var(--t2)"}}>{c}</span>
                </div>
              ))}
            </>}
            {result.controls_missing?.length>0&&<>
              <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t3)",letterSpacing:2,margin:"12px 0 6px"}}>MISSING</div>
              {result.controls_missing.map(c=>(
                <div key={c} style={{display:"flex",gap:7,marginBottom:5,fontSize:11,fontFamily:"var(--mono)"}}>
                  <span style={{color:"var(--red)"}}>✗</span><span style={{color:"var(--t2)"}}>{c}</span>
                </div>
              ))}
            </>}
          </div>
          <div className="card">
            <div className="ctitle">Quick Wins</div>
            {result.quick_wins?.map((w,i)=>(
              <div key={i} style={{background:"rgba(0,212,255,.05)",border:"1px solid var(--cyan-d)",borderRadius:2,padding:"10px 12px",marginBottom:8,fontSize:11,color:"var(--t2)",lineHeight:1.6}}>
                <span style={{color:"var(--cyan)",fontFamily:"var(--mono)",marginRight:6}}>→</span>{w}
              </div>
            ))}
            {result.observability_recommendations?.slice(0,2).map((r,i)=>(
              <div key={i} style={{background:"rgba(204,136,255,.04)",border:"1px solid #442266",borderRadius:2,padding:"10px 12px",marginBottom:8,fontSize:11,color:"var(--t2)",lineHeight:1.6}}>
                <span style={{color:"var(--purple)",fontFamily:"var(--mono)",marginRight:6}}>◎</span>{r}
              </div>
            ))}
          </div>
        </div>

        <div style={{display:"flex",gap:10}}>
          <button className="btn btn-g" onClick={()=>setTab("assess")}>← Modify Assessment</button>
          <button className="btn btn-g" onClick={()=>{setResult(null);setAssessLogs([]);setStep(3);setTab("assess");}}>Clear Results</button>
        </div>
      </div>
    );
  };

  // ── OBS TAB ───────────────────────────────────────────────────
  const ObsTab = () => (
    <div className="fade">
      <div className="g4 mb20">
        {[
          {l:"LLM Requests / hr", v:obs.req[23], c:"var(--cyan)"},
          {l:"Anomalies Detected", v:obs.anom[23], c:"var(--amber)"},
          {l:"Avg Latency (ms)", v:obs.lat[23], c:"var(--green)"},
          {l:"Injection Signals", v:obs.inj[23], c:"var(--red)"},
        ].map(s=>(
          <div key={s.l} className="card" style={{textAlign:"center",padding:"18px 12px"}}>
            <div style={{fontFamily:"var(--mono)",fontSize:30,color:s.c,marginBottom:4}}>{s.v}</div>
            <div style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t2)",letterSpacing:2}}>{s.l}</div>
          </div>
        ))}
      </div>
      <div className="g2 mb20">
        {[
          {l:"Request Volume — 24h", data:obs.req, color:"var(--cyan)"},
          {l:"Anomaly Events — 24h", data:obs.anom, color:"var(--amber)"},
          {l:"Inference Latency (ms)", data:obs.lat, color:"var(--green)"},
          {l:"Injection Signal Rate", data:obs.inj, color:"var(--red)"},
        ].map(c=>(
          <div key={c.l} className="card">
            <div className="ctitle">{c.l}</div>
            <Spark data={c.data} color={c.color}/>
          </div>
        ))}
      </div>
      <div className="card mb20">
        <div className="ctitle">Threat Detection Coverage</div>
        {[
          {l:"Prompt Injection Detection", p:72, c:"var(--cyan)"},
          {l:"Output Content Scanning",    p:88, c:"var(--green)"},
          {l:"Tool Call Monitoring",        p:45, c:"var(--amber)"},
          {l:"RAG Retrieval Logging",       p:91, c:"var(--green)"},
          {l:"Cross-Tenant Isolation",      p:60, c:"var(--yellow)"},
          {l:"Model Weight Integrity",      p:33, c:"var(--red)"},
        ].map(g=>(
          <div key={g.l} className="grow">
            <div className="glbl">{g.l}</div>
            <div className="gtrack"><div className="gfill" style={{width:`${g.p}%`,background:g.c}}/></div>
            <div className="gval" style={{color:g.c}}>{g.p}%</div>
          </div>
        ))}
      </div>
      <div className="card">
        <div className="ctitle">Live Event Stream</div>
        <div className="term" style={{maxHeight:180}}>
          {[
            {c:"td",m:"[00:00:12] [MONITOR] Token usage within bounds — 847 tokens"},
            {c:"ta",m:"[00:00:31] [INJECT?] Suspicious pattern detected — score 0.34"},
            {c:"td",m:"[00:00:31] [MONITOR] Below threshold (0.7) — allowed"},
            {c:"tc",m:"[00:01:02] [TOOL]    Agent invoked web_search: 'quarterly earnings'"},
            {c:"td",m:"[00:01:04] [AUDIT]   Tool call logged — parameters within range"},
            {c:"tg",m:"[00:02:15] [MONITOR] Output scan complete — no PII detected"},
            {c:"tr",m:"[00:03:41] [INJECT!] High-confidence injection attempt — score 0.89"},
            {c:"tr",m:"[00:03:41] [BLOCK]   Request blocked. Incident logged. User notified."},
            {c:"td",m:"[00:04:02] [MONITOR] RAG retrieval — 3 docs, all within access scope"},
            {c:"tg",m:"[00:05:18] [AUDIT]   Session written to immutable log store"},
          ].map((e,i)=><div key={i}><span className={e.c}>{e.m}</span></div>)}
        </div>
      </div>
    </div>
  );

  const findingsCount = result?.findings?.length || 0;
  const critCount = result?.findings?.filter(f=>f.severity==="CRITICAL").length||0;

  return (
    <>
      <style>{STYLES}</style>
      <div className="app">
        <header className="hdr">
          <div className="hdr-l">
            <div className="hex">AI</div>
            <div className="logo-t">
              <div className="logo-main">AISPM</div>
              <div className="logo-sub">AI SECURITY POSTURE MANAGEMENT · LLMTRUST LAYER</div>
            </div>
          </div>
          <div className="hdr-r">
            <div className="pulse-dot"/>
            <span>OPERATIONAL</span>
            {discovered && <span className="pill pill-ok" style={{marginLeft:4}}>{discovered.provider.name} CONNECTED</span>}
            <span style={{color:"var(--t3)",marginLeft:8}}>{clock} UTC</span>
          </div>
        </header>

        <nav className="tabs">
          {[
            {id:"connect",  label:"// CONNECT"},
            {id:"discover", label:"// DISCOVER"},
            {id:"assess",   label:"// ASSESS"},
            {id:"results",  label:"// FINDINGS", badge: critCount > 0 ? critCount : null},
            {id:"obs",      label:"// OBSERVABILITY"},
          ].map(t=>(
            <button key={t.id} className={`tab ${tab===t.id?"on":""}`} onClick={()=>setTab(t.id)}>
              {t.label}
              {t.badge && <span className="tab-badge">{t.badge}</span>}
            </button>
          ))}
          {result && (
            <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,paddingBottom:2}}>
              <span style={{fontFamily:"var(--mono)",fontSize:9,color:"var(--t2)"}}>LAST:</span>
              <span className={`sev ${sevClass(result.risk_level)}`}>{result.risk_level}</span>
              <span style={{fontFamily:"var(--mono)",fontSize:10,color:"var(--t2)"}}>{result.posture_score}/100</span>
            </div>
          )}
        </nav>

        {tab==="connect"  && <ConnectTab/>}
        {tab==="discover" && <DiscoverTab/>}
        {tab==="assess"   && <AssessTab/>}
        {tab==="results"  && <ResultsTab/>}
        {tab==="obs"      && <ObsTab/>}
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AISPM />);

  </script>

  <!-- Hide loading screen once React mounts -->
  <script>
    // Poll for root content — hide loader once React has rendered
    const loadStatus = document.getElementById('load-status');
    const steps = ['LOADING REACT...', 'TRANSPILING JSX...', 'INITIALISING APP...', 'READY'];
    let si = 0;
    const stepInterval = setInterval(() => {
      si = Math.min(si + 1, steps.length - 1);
      if (loadStatus) loadStatus.textContent = steps[si];
    }, 800);

    const hideLoader = setInterval(() => {
      const root = document.getElementById('root');
      if (root && root.children.length > 0) {
        clearInterval(hideLoader);
        clearInterval(stepInterval);
        const loader = document.getElementById('loading');
        if (loader) {
          loader.style.transition = 'opacity 0.4s ease';
          loader.style.opacity = '0';
          setTimeout(() => loader.remove(), 400);
        }
      }
    }, 100);
  </script>

</body>
</html>
